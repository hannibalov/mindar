<!DOCTYPE html>
<html>
  <head>
    <title>Entity</title>
    <meta name="description" content="A-Frame Entity">
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.5.0/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene environment="preset: forest">
      <a-assets>
        <img id="boxTexture" src="oxid.png">
        <a-asset-item id="objecte" src="monkey03.obj"></a-asset-item>
        <a-asset-item id="objecte-mtl" src="monkey03.mtl"></a-asset-item>
      </a-assets>     
      <a-box position="3 3 -10" rotation="0 45 45" scale="2 2 2" src="#boxTexture"
             animation__scale="property: scale; dir: alternate; dur: 1000; loop: true; to: 2.2 2.2 2.2"
             animation__mouseenter="property: rotation; startEvents: mouseenter; dur: 300; to: 360 45 45">
      </a-box>
      <a-entity obj-model="obj: #objecte; mtl: #objecte-mtl"
	  	material="color: red; opacity: 1.0"
	  	position="-3 2 -5"
	  	rotation="0 0 0"
        animation="property: rotation; dir: alternate; dur: 5000; loop: true; to: 360 360 360">
      </a-entity>
      <a-text value="Welcome!" color="#ff0000" position="-0.9 0.2 -3" scale="1.5 1.5 1.5"></a-text>      
      <a-camera>
        <a-cursor color="#66ffff"></a-cursor>
      </a-camera>
    </a-scene>
  </body>
</html>
